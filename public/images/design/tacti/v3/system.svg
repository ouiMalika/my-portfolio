<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Inter, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8780"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="#f6f5f2"/>

  <!-- Phone -->
  <rect x="40" y="60" width="610" height="330" rx="18" fill="#fbfaf8" stroke="#c9c6bf"/>
  <text x="62" y="92" fill="#6b6b6b" font-size="13" letter-spacing="1.5">PHONE · TACTI APP</text>

  <g font-size="15" fill="#1d1d1f">
    <rect x="70" y="120" width="150" height="70" rx="12" fill="#fff" stroke="#c9c6bf"/>
    <text x="145" y="150" text-anchor="middle" font-weight="600">Compass</text>
    <text x="145" y="172" text-anchor="middle" fill="#6b6b6b" font-size="13">heading</text>

    <rect x="70" y="210" width="150" height="70" rx="12" fill="#fff" stroke="#c9c6bf"/>
    <text x="145" y="240" text-anchor="middle" font-weight="600">Accelerometer</text>
    <text x="145" y="262" text-anchor="middle" fill="#6b6b6b" font-size="13">steps</text>

    <rect x="260" y="165" width="160" height="70" rx="12" fill="#fff" stroke="#c9c6bf"/>
    <text x="340" y="195" text-anchor="middle" font-weight="600">Position</text>
    <text x="340" y="217" text-anchor="middle" fill="#6b6b6b" font-size="13">on the aisle map</text>

    <rect x="460" y="165" width="160" height="70" rx="12" fill="#fff" stroke="#7d1128" stroke-width="1.5"/>
    <text x="540" y="195" text-anchor="middle" font-weight="600" fill="#7d1128">Guidance</text>
    <text x="540" y="217" text-anchor="middle" fill="#6b6b6b" font-size="13">turn · straight · arrive</text>

    <rect x="70" y="310" width="150" height="56" rx="12" fill="#fff" stroke="#c9c6bf" stroke-dasharray="5 5"/>
    <text x="145" y="343" text-anchor="middle" fill="#6b6b6b" font-size="13">entrance, facing in</text>

    <rect x="460" y="300" width="160" height="70" rx="12" fill="#fff" stroke="#c9c6bf"/>
    <text x="540" y="330" text-anchor="middle" font-weight="600">Phone output</text>
    <text x="540" y="352" text-anchor="middle" fill="#6b6b6b" font-size="13">taps · tone · voice</text>
  </g>

  <!-- Device -->
  <rect x="740" y="60" width="420" height="330" rx="18" fill="#fbfaf8" stroke="#c9c6bf"/>
  <text x="762" y="92" fill="#6b6b6b" font-size="13" letter-spacing="1.5">TACTI · BACK OF THE PHONE</text>
  <g font-size="15" fill="#1d1d1f">
    <rect x="770" y="165" width="160" height="70" rx="12" fill="#fff" stroke="#c9c6bf"/>
    <text x="850" y="195" text-anchor="middle" font-weight="600">ESP32-S3</text>
    <text x="850" y="217" text-anchor="middle" fill="#6b6b6b" font-size="13">cue → pulse plan</text>

    <rect x="970" y="165" width="160" height="70" rx="12" fill="#fff" stroke="#c9c6bf"/>
    <text x="1050" y="195" text-anchor="middle" font-weight="600">DRV8833</text>
    <text x="1050" y="217" text-anchor="middle" fill="#6b6b6b" font-size="13">motor driver</text>

    <rect x="900" y="290" width="110" height="64" rx="32" fill="#fff" stroke="#f26419" stroke-width="1.5"/>
    <text x="955" y="327" text-anchor="middle" font-weight="600">Left motor</text>
    <rect x="1030" y="290" width="110" height="64" rx="32" fill="#fff" stroke="#f26419" stroke-width="1.5"/>
    <text x="1085" y="327" text-anchor="middle" font-weight="600">Right motor</text>
  </g>

  <g stroke="#8a8780" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M220 155 H240 V190 H256"/>
    <path d="M220 245 H240 V210 H256"/>
    <path d="M145 310 V294"/>
    <path d="M420 200 H456"/>
    <path d="M540 235 V296"/>
    <path d="M930 200 H966"/>
    <path d="M1050 235 V262 H955 V286"/>
    <path d="M1050 235 V262 H1085 V286"/>
  </g>
  <g stroke="#7d1128" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M620 200 H766" stroke-dasharray="6 5"/>
  </g>
  <text x="693" y="190" text-anchor="middle" font-size="13" fill="#7d1128">Wi-Fi</text>
  <text x="693" y="222" text-anchor="middle" font-size="13" fill="#6b6b6b">cue</text>

  <!-- Cue vocabulary -->
  <text x="40" y="452" fill="#6b6b6b" font-size="13" letter-spacing="1.5">CUES</text>
  <g font-size="14" fill="#1d1d1f">
    <g transform="translate(40,470)">
      <rect width="210" height="130" rx="14" fill="#fff" stroke="#c9c6bf"/>
      <text x="18" y="32" font-weight="600">Turn left</text>
      <text x="18" y="56" fill="#6b6b6b" font-size="13">left motor, 2 × 120 ms</text>
      <text x="18" y="76" fill="#6b6b6b" font-size="13">every 1.5 s until aligned</text>
      <rect x="18" y="96" width="26" height="12" rx="6" fill="#7d1128"/><rect x="52" y="96" width="26" height="12" rx="6" fill="#7d1128"/>
    </g>
    <g transform="translate(270,470)">
      <rect width="210" height="130" rx="14" fill="#fff" stroke="#c9c6bf"/>
      <text x="18" y="32" font-weight="600">Turn right</text>
      <text x="18" y="56" fill="#6b6b6b" font-size="13">right motor, 2 × 120 ms</text>
      <text x="18" y="76" fill="#6b6b6b" font-size="13">every 1.5 s until aligned</text>
      <rect x="132" y="96" width="26" height="12" rx="6" fill="#7d1128"/><rect x="166" y="96" width="26" height="12" rx="6" fill="#7d1128"/>
    </g>
    <g transform="translate(500,470)">
      <rect width="210" height="130" rx="14" fill="#fff" stroke="#c9c6bf"/>
      <text x="18" y="32" font-weight="600">Straight</text>
      <text x="18" y="56" fill="#6b6b6b" font-size="13">motors quiet</text>
      <text x="18" y="76" fill="#6b6b6b" font-size="13">soft tone every 5 s</text>
      <rect x="18" y="100" width="174" height="4" rx="2" fill="#e4e1da"/>
    </g>
    <g transform="translate(730,470)">
      <rect width="210" height="130" rx="14" fill="#fff" stroke="#c9c6bf"/>
      <text x="18" y="32" font-weight="600">Arrived</text>
      <text x="18" y="56" fill="#6b6b6b" font-size="13">both motors, 2 × 280 ms</text>
      <text x="18" y="76" fill="#6b6b6b" font-size="13">once, then check the shelf</text>
      <rect x="18" y="96" width="60" height="12" rx="6" fill="#f26419"/><rect x="88" y="96" width="60" height="12" rx="6" fill="#f26419"/>
    </g>
    <g transform="translate(960,470)">
      <rect width="200" height="130" rx="14" fill="#fff" stroke="#c9c6bf"/>
      <text x="18" y="32" font-weight="600">Pause</text>
      <text x="18" y="56" fill="#6b6b6b" font-size="13">both motors, 3 × 100 ms</text>
      <text x="18" y="76" fill="#6b6b6b" font-size="13">guidance holds</text>
      <rect x="18" y="96" width="18" height="12" rx="6" fill="#f6ae2d"/><rect x="44" y="96" width="18" height="12" rx="6" fill="#f6ae2d"/><rect x="70" y="96" width="18" height="12" rx="6" fill="#f6ae2d"/>
    </g>
  </g>
</svg>
